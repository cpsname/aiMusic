name: app_config
description: "Runtime app governance (maintenance gate / feature kill-switches / remote parameters) from GET /app/config. A bounded context separate from the app/init startup snapshot."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  infra_core:
    path: ../infra_core
  collection: ^1.18.0
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
