name: infra_core
description: "Pure infrastructure: network, crypto, error, config, storage, device. Zero business, zero UI."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  # Pinned per dev contract (iOS 26 API needs Xcode 17 — satisfied by Xcode 26.5,
  # but kept pinned as specified). This holds win32 at ^5.x.
  device_info_plus: ">=11.0.0 <12.4.0"
  # Aligned to the 8.x line so its win32 (^5.x) is compatible with device_info_plus's.
  package_info_plus: ">=8.0.0 <9.0.0"
  uuid: ^4.5.3
  flutter_riverpod: ^3.3.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod: ^3.3.2
  mocktail: ^1.0.5
