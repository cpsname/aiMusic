name: songlet_kit
description: "Songlet business core: creation (occasions, region presets, preflight, Lyria jobs), library (SQLite works), entitlement (StoreKit 2 over the Pigeon bridge → commerce_kit), playback, export and share."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  infra_core:
    path: ../infra_core
  commerce_kit:
    path: ../commerce_kit
  media_kit:
    path: ../media_kit
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2
  meta: ^1.15.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.3.6
